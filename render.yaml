# Optional: Render Blueprint (Infrastructure-as-Code)
#
# This lets Render auto-configure the service from this file instead of
# filling in the dashboard by hand. It's OPTIONAL - if "New Blueprint
# Instance" doesn't pick this up correctly, just follow the manual "New
# Web Service" steps in DEPLOYMENT.md instead, which are the
# primary/tested path and don't depend on this file's syntax at all.
services:
  - type: web
    name: dpdp-act-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        value: neo4j
      - key: NEO4J_PASSWORD
        sync: false
      - key: ALLOWED_ORIGIN
        value: "*"
